name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          sources="$(find . -name '*.go')"
          unformatted="$(gofmt -l $sources)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build both mac architectures
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              go build -trimpath -o "dist/wxdl_darwin_$arch" .
          done
          ls -l dist

      - name: verify pinned upstream assets
        # Re-checks the hashes recorded in packaging/upstream.env against the
        # real upstream release, so a renamed or tampered asset breaks here
        # rather than on a user's machine.
        run: ./packaging/fetch-upstream.sh

  gui:
    # The desktop shell is Swift: compile it for both deployment targets on
    # every push so a Swift breakage never waits for a release tag.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: compile SwiftUI app
        run: |
          mkdir -p dist
          for target in arm64 x86_64; do
            swiftc -O -whole-module-optimization -parse-as-library -swift-version 5 \
              -target "${target}-apple-macos12.0" \
              -framework SwiftUI -framework AppKit \
              gui/*.swift -o "dist/wxdl-gui-${target}"
          done
          ls -l dist

      - name: build icon
        run: swift packaging/gui/make-icon.swift build/AppIcon.icns
